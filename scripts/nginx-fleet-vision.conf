# /etc/nginx/sites-available/fleet-vision
# Fleet Vision Nginx Reverse Proxy Configuration
# Maps port 80 to container port 3000 with SSE and WebSocket support

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Increase maximum upload size if needed
    client_max_body_size 20M;

    # Gzip compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── Main Reverse Proxy (Next.js Dashboard & APIs) ──────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # ─── Real-Time SSE Streams (/api/v1/stream/* and /api/v1/alerts/stream) ────
    # Server-Sent Events require buffering to be disabled so chunks stream in real-time
    location ~* ^/api/v1/(stream|alerts/stream) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Keep alive long-lived streams (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# WebSocket connection helper map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
