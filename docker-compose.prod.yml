# docker-compose.prod.yml — Production overrides (EC2)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ─── TimescaleDB + PostGIS (Production) ─────────────────────
  timescaledb:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: fv-timescaledb
    restart: always
    networks:
      - fleet-net
    ports:
      - "5433:5432"           # Host port 5433 for external psql access / debugging
    env_file:
      - path: .env.production
        required: true
    environment:
      POSTGRES_USER: "${TIMESCALE_USER:-postgres}"
      POSTGRES_PASSWORD: "${TIMESCALE_PASSWORD}"
      POSTGRES_DB: fleet_vision
    volumes:
      - ${TIMESCALE_DATA_PATH:-/opt/timescaledb/data}:/var/lib/postgresql/data    # Persist on EC2 host disk
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/010-init-timescaledb.sql:ro
    shm_size: "256mb"         # PostgreSQL shared_buffers needs adequate shared memory
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Backend API (Production Overrides) ─────────────────────
  backend-api:
    restart: always
    env_file:
      - path: .env.production
        required: true
    environment:
      NODE_ENV: production
      # Connect to TimescaleDB container via Docker network
      TIMESCALE_URL: "postgresql://${TIMESCALE_USER:-postgres}:${TIMESCALE_PASSWORD}@timescaledb:5432/fleet_vision?schema=public"
    depends_on:
      timescaledb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Data Processor (Production Overrides) ──────────────────
  data-processor:
    restart: always
    env_file:
      - path: .env.production
        required: true
    environment:
      NODE_ENV: production
      # Connect to TimescaleDB container via Docker network
      TIMESCALE_URL: "postgresql://${TIMESCALE_USER:-postgres}:${TIMESCALE_PASSWORD}@timescaledb:5432/fleet_vision?schema=public"
      RETENTION_MONTHS: "${RETENTION_MONTHS:-6}"
      STALE_THRESHOLD_MINUTES: "${STALE_THRESHOLD_MINUTES:-5}"
      INACTIVE_THRESHOLD_HOURS: "${INACTIVE_THRESHOLD_HOURS:-24}"
      ARCHIVE_DIR: "${ARCHIVE_DIR:-/app/archives}"
    depends_on:
      timescaledb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── TCP Ingestion Gateway (Production Overrides) ───────────
  tcp-server:
    restart: always
    env_file:
      - path: .env.production
        required: true
    environment:
      TCP_PORT: "${TCP_PORT:-8500}"
      HEALTH_PORT: "${HEALTH_PORT:-8501}"
      KAFKA_BROKERS: "${KAFKA_BROKERS}"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-telemetry-raw}"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
