# docker-compose.infra.yml — Local development infrastructure
# Usage: docker compose -f docker-compose.yml -f docker-compose.infra.yml up --build

services:
  # ─── TimescaleDB + PostGIS (Local Dev) ──────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: fv-postgres
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet_vision
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/010-init-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: fv-redis
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (KRaft mode) ────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fv-kafka
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Override app services for local infra dependencies ────
  backend-api:
    environment:
      # Local: connect via Docker DNS (container name)
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/fleet_vision?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-processor:
    environment:
      # Local: connect via Docker DNS (container name)
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/fleet_vision?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tcp-server:
    environment:
      # Local: connect to Kafka container via internal Docker network
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  kafka_data:
