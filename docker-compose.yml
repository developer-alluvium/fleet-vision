# docker-compose.yml — Base application services
# Local:  docker compose -f docker-compose.yml -f docker-compose.infra.yml up
# Prod:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

networks:
  fleet-net:
    driver: bridge

services:
  # ─── Backend APIs (Next.js) ─────────────────────────────────
  backend-api:
    image: punit084/gps:backend-api
    build:
      context: .
      dockerfile: apps/web-dashboard/Dockerfile
    container_name: fv-backend-api
    restart: unless-stopped
    networks:
      - fleet-net
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      TIMESCALE_URL: "${TIMESCALE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      PORT: "3000"
    volumes:
      - archives_data:/app/archives
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { if (res.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Data Processor Worker ──────────────────────────────────
  data-processor:
    image: punit084/gps:data-processor
    build:
      context: .
      dockerfile: apps/data-processor/Dockerfile
    container_name: fv-data-processor
    restart: unless-stopped
    networks:
      - fleet-net
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      TIMESCALE_URL: "${TIMESCALE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-}"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-telemetry-raw}"
      CONSUMER_GROUP: "${CONSUMER_GROUP:-data-processor-group}"
      ENABLE_COLD_STORAGE: "${ENABLE_COLD_STORAGE:-false}"
    volumes:
      - archives_data:/app/archives
    stop_grace_period: 30s

volumes:
  archives_data:
